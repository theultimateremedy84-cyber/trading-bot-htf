  /bot/reset-session:
    post:
      operationId: resetBotSession
      tags: [bot]
      summary: Reset session P&L counter to zero or a custom starting value
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                startingPnl:
                  type: number
                  default: 0
                  description: The effective P&L value to start from after reset (default 0)
      responses:
        "200":
          description: Session reset
          content:
            application/json:
              schema:
                type: object
                required: [success, startingPnl]
                properties:
                  success:
                    type: boolean
                  startingPnl:
                    type: number
        "400":
          description: Invalid input
